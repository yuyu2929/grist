[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "grist-raster"
version = "0.1.1"
description = "Exact vector-to-raster translation: cell-integral semantics, aggregated pyramids, content-addressed tiles"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Grist contributors" }]
keywords = ["gis", "raster", "rasterization", "vector", "coverage", "geojson"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]
# Zero runtime dependencies -- the whole core is standard library only.
dependencies = []

[project.optional-dependencies]
# optional: AES-GCM backend for the enterprise `container.encrypt` feature
enterprise = ["cryptography>=41"]
test = ["numpy", "shapely", "pytest"]
bench = ["numpy", "shapely"]

[project.scripts]
grist = "grist.cli:main"

[tool.setuptools.packages.find]
include = ["grist*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
